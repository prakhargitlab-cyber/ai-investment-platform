spring:
  application:
    name: portfolio-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:investment}?sslmode=${DB_SSL_MODE:disable}&connectTimeout=${DB_CONNECT_TIMEOUT_SECONDS:10}&socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:30}
    username: ${DB_USER:investment}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE:8}
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: portfolio
    open-in-view: false
  flyway:
    enabled: true
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
    validate-on-migrate: true
    out-of-order: false
    schemas: portfolio
    default-schema: portfolio
    table: flyway_schema_history_portfolio
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_TLS_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_READ_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:2s}
market:
  demo-mode: ${MARKET_DATA_DEMO_MODE:false}
  nifty500:
    url: ${MARKET_NIFTY500_URL:https://www.niftyindices.com/IndexConstituent/ind_nifty500list.csv}
  quote-cache:
    mode: ${MARKET_QUOTE_CACHE_MODE:memory}
    ttl: ${MARKET_QUOTE_CACHE_TTL:PT5M}
broker:
  service:
    base-url: ${BROKER_SERVICE_BASE_URL:http://broker-service}
research:
  engine:
    base-url: ${RESEARCH_ENGINE_BASE_URL:http://research-engine}
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} service=${spring.application.name} environment=${AIP_ENVIRONMENT:LOCAL} level=%p requestId=%X{correlationId:-} logger=%logger{36} message=%replace(%msg){'[\\r\\n]',' '}%n"
---
spring:
  config:
    activate:
      on-profile: "LOCAL | DEV"
market:
  demo-mode: ${MARKET_DATA_DEMO_MODE:true}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
