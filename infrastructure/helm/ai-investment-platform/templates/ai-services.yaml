{{- range .Values.aiServices }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ include "aip.image" (dict "root" $ "image" .image "tag" .tag) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: AIP_ENVIRONMENT
              value: {{ $.Values.global.environment | quote }}
            {{- if eq .name "research-engine" }}
            - name: AIP_RESEARCH_LIVE_ENABLED
              value: {{ default false $.Values.research.liveEnabled | quote }}
            - name: AIP_RESEARCH_DEMO_ENABLED
              value: {{ default true $.Values.research.demoEnabled | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .port }}
          resources:
            {{- toYaml (default $.Values.aiServiceDefaults.resources .resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  selector:
    app.kubernetes.io/component: {{ .name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .port }}
---
{{- end }}
