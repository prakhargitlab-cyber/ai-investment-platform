global:
  # Deployment profile is intentionally separate from the Spring profile so
  # existing DEV behavior remains available while LOCAL/TEST/AZURE are explicit.
  environment: LOCAL
  springProfile: LOCAL
  imageRegistry: localhost:5001
  imagePullPolicy: IfNotPresent
  imageTag: ""
  imagePullSecrets: []
  timezone: UTC
  serviceAccount:
    create: true
    name: ai-investment-platform
    annotations: {}
    automountServiceAccountToken: false
  azure:
    workloadIdentity:
      enabled: false
      clientId: ""
      tenantId: ""
      workloads: []
  podAnnotations: {}
  podLabels: {}
  revisionHistoryLimit: 3
  terminationGracePeriodSeconds: 30
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  temporaryStorage:
    enabled: true
    mountPath: /tmp
    sizeLimit: 256Mi
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  topologySpread:
    enabled: false
    topologyKey: topology.kubernetes.io/zone
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  observability:
    otel:
      enabled: false
      tracesEnabled: false
      metricsEnabled: false
      exporterOtlpEndpoint: ""
      exporterOtlpProtocol: grpc
      resourceAttributes: ""
      javaAgentInjection: false
      pythonAgentInjection: false

serviceEndpoints:
  auth: http://auth-service
  portfolio: http://portfolio-service
  broker: http://broker-service
  ibkrConnector: http://ibkr-connector
  company: http://company-service
  research: http://research-service
  researchEngine: http://research-engine
  mcpGateway: http://mcp-gateway
  yahooFinanceMcp: http://yahoo-finance-mcp
  frontend: http://frontend

database:
  host: postgres
  port: 5432
  name: investment
  username: investment
  authMode: password
  passwordSecretName: dev-postgres
  passwordSecretKey: POSTGRES_PASSWORD
  sslMode: disable
  connectTimeoutSeconds: 10
  socketTimeoutSeconds: 30
  pool:
    maximumSize: 8
    minimumIdle: 1
    connectionTimeoutMs: 10000
    idleTimeoutMs: 600000
    maxLifetimeMs: 1800000

redis:
  url: ""
  host: redis
  port: 6379
  tlsEnabled: false
  username: ""
  passwordSecretName: ""
  passwordSecretKey: REDIS_PASSWORD
  connectTimeout: 3s
  readTimeout: 3s
  pool:
    maxActive: 8
    maxIdle: 8
    minIdle: 0
    maxWait: 2s

kafka:
  enabled: false
  bootstrapServers: kafka:9092
  securityProtocol: PLAINTEXT
  saslMechanism: PLAIN
  username: ""
  consumerGroupPrefix: ai-investment-local
  credentialSecretName: ""
  passwordSecretKey: KAFKA_PASSWORD
  sslTruststoreSecretName: ""
  sslTruststoreSecretKey: KAFKA_TRUSTSTORE
  sslTruststoreMountPath: /etc/ai-investment/kafka
  sslTruststoreType: PEM
  clientDnsLookup: use_all_dns_ips
  requestTimeoutMs: 30000
  deliveryTimeoutMs: 120000
  retries: 5

objectStorage:
  enabled: false
  provider: disabled
  accountName: ""
  endpoint: ""
  container: ""
  authMode: workloadIdentity
  temporary:
    enabled: false
    ttlSeconds: 3600

keyVault:
  enabled: false
  name: ""
  tenantId: ""
  clientId: ""
  secretProviderClassName: aip-key-vault
  mountPath: /mnt/secrets-store
  cloudName: ""
  workloads:
    - api-gateway
    - auth-service
    - portfolio-service
    - broker-service
    - research-service
    - research-engine
    - mcp-gateway
  objects: []
  secretObjects: []

networkPolicy:
  enabled: false
  allowSameNamespace: true
  ingressController:
    enabled: false
    namespace: ""
    podLabels: {}
  egress:
    enabled: false
    allowDns: true
    additionalRules: []

frontend:
  enabled: true
  image: ai-investment/frontend
  tag: latest
  port: 3000
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  probes:
    startup:
      enabled: true
      path: /api/health
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    readiness:
      path: /api/health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /api/health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  cache:
    enabled: true
    mountPath: /app/.next/cache
    sizeLimit: 256Mi

apiGateway:
  http:
    connectTimeout: 3s
    readTimeout: 30s
  cors:
    allowedOrigins: []
  ingress:
    enabled: false
    className: traefik
    annotations: {}
    host: ""
    path: /
    pathType: Prefix
    tls: []
  rateLimiting:
    enabled: false
    # Controller-specific annotations belong in ingress.annotations once an
    # ingress controller has been selected.
    requestsPerSecond: 0
    burst: 0

