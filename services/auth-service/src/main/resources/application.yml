spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:investment}?sslmode=${DB_SSL_MODE:disable}&connectTimeout=${DB_CONNECT_TIMEOUT_SECONDS:10}&socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:30}
    username: ${DB_USER:investment}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE:8}
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
    open-in-view: false
  flyway:
    enabled: true
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
    validate-on-migrate: true
    out-of-order: false
    schemas: auth
    default-schema: auth
    table: flyway_schema_history_auth
auth:
  issuer: ${AUTH_ISSUER:ai-investment-dev}
  jwt-secret: ${AUTH_JWT_SECRET:dev-phase5a-local-jwt-secret-change-me-32}
  token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:28800}
  verification-token-ttl-seconds: ${AUTH_VERIFICATION_TOKEN_TTL_SECONDS:86400}
  password-reset-token-ttl-seconds: ${AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS:3600}
  dev-login-enabled: ${AUTH_DEV_LOGIN_ENABLED:false}
  email-mode: ${AUTH_EMAIL_MODE:DISABLED}
  smtp-host: ${SMTP_HOST:}
  smtp-port: ${SMTP_PORT:587}
  smtp-username: ${SMTP_USERNAME:}
  smtp-password: ${SMTP_PASSWORD:}
  smtp-from: ${SMTP_FROM:}
  app-public-url: ${APP_PUBLIC_URL:}
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} service=${spring.application.name} environment=${AIP_ENVIRONMENT:LOCAL} level=%p requestId=%X{correlationId:-} logger=%logger{36} message=%replace(%msg){'[\\r\\n]',' '}%n"
---
spring:
  config:
    activate:
      on-profile: "LOCAL | DEV"
auth:
  dev-login-enabled: ${AUTH_DEV_LOGIN_ENABLED:true}
