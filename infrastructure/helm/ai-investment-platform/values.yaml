    liveness:
      path: /health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  networkPolicy:
