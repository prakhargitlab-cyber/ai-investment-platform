spring:
  datasource:
    url: jdbc:h2:mem:broker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
broker:
  icici-direct:
    enabled: true
    base-url: https://api.icicidirect.com/breezeapi/api/v1/
    login-url: https://api.icicidirect.com/apiuser/login
    app-key: dummy-test-app-key
    redirect-url: https://application.example.test/icici/return
    auth-method: breeze-interactive-session
    secret-key-reference: ICICI_DUMMY_TEST_SECRET
    official-documentation-verified: true
