{{- range .Values.javaServices }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ include "aip.image" (dict "root" $ "image" .image "tag" .tag) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $.Values.global.environment | quote }}
            - name: SERVER_PORT
              value: {{ .port | quote }}
            {{- if eq .name "api-gateway" }}
            - name: RESEARCH_ENGINE_BASE_URL
              value: "http://research-engine"
            {{- end }}
            {{- if eq .name "broker-service" }}
            - name: IBKR_ENABLED
              value: "false"
            - name: IBKR_OFFICIAL_DOCUMENTATION_VERIFIED
              value: "false"
            - name: ICICI_DIRECT_ENABLED
              value: "false"
            - name: ICICI_DIRECT_OFFICIAL_DOCUMENTATION_VERIFIED
              value: "false"
            {{- end }}
            {{- if eq .name "portfolio-service" }}
            - name: MARKET_DATA_DEMO_MODE
              value: {{ ternary "true" "false" (eq $.Values.global.environment "DEV") | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .port }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .port }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .port }}
          resources:
            {{- toYaml (default $.Values.javaServiceDefaults.resources .resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  selector:
    app.kubernetes.io/component: {{ .name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .port }}
---
{{- end }}
