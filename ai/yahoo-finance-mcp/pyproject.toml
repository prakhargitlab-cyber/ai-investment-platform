[project]
name = "ai-investment-yahoo-finance-mcp"
version = "0.1.0"
description = "First-party read-only Yahoo Finance MCP server"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "opentelemetry-api>=1.28,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "yfinance>=1.0.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
aip-yahoo-finance-mcp = "yahoo_mcp_server.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["yahoo_mcp_server*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
