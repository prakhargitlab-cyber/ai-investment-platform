global:
  environment: LOCAL
  springProfile: LOCAL
  imageRegistry: localhost:5001
  imageTag: dev
  imagePullPolicy: IfNotPresent

apiGateway:
  cors:
    allowedOrigins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:13000
  ingress:
    enabled: true

auth:
  issuer: ai-investment-dev
  devLoginEnabled: true
  email:
    mode: SMTP
    smtpHost: smtp.gmail.com
    smtpPort: 587
    smtpFrom: prakhar.unique@gmail.com
    publicUrl: http://localhost:18080
    credentialSecretName: auth-smtp-credentials
    usernameSecretKey: SMTP_USERNAME
    passwordSecretKey: SMTP_PASSWORD
  createDevSecret: true
  devJwtSecret: dev-phase5a-local-jwt-secret-change-me-32
  jwtSecretName: aip-auth-jwt
  jwtSecretKey: jwt-secret

devDependencies:
  enabled: true
  postgres:
    password: dev-local-postgres-password
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: local-path
      size: 5Gi
  searxng:
    enabled: true

research:
  liveEnabled: true
  demoEnabled: false
  logLevel: INFO
  persistence:
    enabled: true
    databaseBackend: postgres
    databaseHost: postgres
    databasePort: 5432
    databaseName: investment
    databaseUser: investment
    databaseSchema: research
    passwordSecretName: dev-postgres
    passwordSecretKey: POSTGRES_PASSWORD
  # LOCAL/DEV: paused so the worker never auto-resumes/schedules and manual
  # submission endpoints are reachable for controlled validation. See
  # research_opportunity_recovery_paused in app/settings.py.
  opportunityRecoveryPaused: true
  # Explicit for DEV visibility/audit; matches the chart default.
  opportunityScheduler:
    enabled: false
  # LOCAL/DEV: explicit ADMIN-gated manual Equity Radar execution.
  # Does not by itself resume automatic/historical work -- the
  # application-layer admission gate still independently requires
  # environment==LOCAL, the scheduler disabled (set above) and
  # recovery paused (research_opportunity_recovery_paused; not
  # currently set anywhere in this chart -- see deployment
  # prerequisites in the handoff report before relying on this flag
  # alone to unblock manual Equity submission).
  equityManualExecutionEnabled: true
  # LOCAL/DEV: kept explicitly false unless a controlled validation run
  # has been expressly approved. Flip to true only for that run, and only
  # with recovery paused and the scheduler disabled (both set above); see
  # research_etf_manual_execution_enabled in app/settings.py.
  etfManualExecutionEnabled: false
  # LOCAL/DEV: independent full-NSE-universe permission, also kept
  # explicitly false unless expressly approved for a controlled run; see
  # research_etf_full_universe_execution_enabled in app/settings.py.
  etfFullUniverseExecutionEnabled: true
  # LOCAL/DEV: one explicit, independently-verified NSE trading-series
  # override, confirmed against the official NSE Security-wise Archives
  # page for this single instrument only (Triveni Power Transmission
  # Limited, symbol TRIVENIPT). Scoped to exactly this instrument_id; no
  # other instrument is affected, and this is never auto-derived -- see
  # app.settings.Settings.nse_verified_trading_series_overrides.
  providers:
    nseVerifiedTradingSeriesOverrides:
      0030eb97-ec3c-493a-9933-8cd91469baec: BE
  portfolioServiceBaseUrl: http://portfolio-service
  mcpAcquisition:
    enabled: true
    gatewayBaseUrl: http://mcp-gateway
    timeoutSeconds: 10
    serviceIdentity: research-engine
  search:
    enabled: true
    provider: searxng
    endpoint: http://searxng/search
    engineId: ""
    engineIdSecretName: research-search-secret
    engineIdSecretKey: google-engine-id
    apiKeySecretName: research-search-secret
    apiKeySecretKey: google-api-key

ibkr:
  enabled: true
  authMethod: client-portal-gateway
  officialDocumentationVerified: true
  marketDataEnabled: false
  insecureTls: false
  connectorBaseUrl: http://ibkr-connector
  connectorRuntimeMode: LOCAL_AGENT
  connectorLoginUrl: /api/v1/broker-connectors/login
  connectorInternalToken: dev-internal-connector-token-change-me
  connectorInternalTokenSecretName: ibkr-runtime-internal-token
  connectorInternalTokenSecretKey: AIP_INTERNAL_TOKEN

ibkrConnector:
  enabled: true
  runtimeMode: LOCAL_AGENT
  productionApproved: false
  gatewayPackagePath: /opt/ibkr/clientportal.gw
  gatewayBaseUrl: https://127.0.0.1:5000/v1/api
  gatewayTlsVerify: false
  loginPublicBaseUrl: http://localhost:18080
  internalToken: dev-internal-connector-token-change-me
  internalTokenSecretName: ibkr-runtime-internal-token
  internalTokenSecretKey: AIP_INTERNAL_TOKEN
  packageVolumeClaim: ibkr-gateway-package-dev

ibkrRuntime:
  mode: KUBERNETES
  serviceAccount:
    create: true
    name: broker-service-runtime-orchestrator
  image:
    repository: ai-investment/ibkr-connector
    tag: dev
  gatewayPackage:
    claimName: ibkr-gateway-package-dev
  gateway:
    baseUrl: https://127.0.0.1:5000/v1/api
    tlsVerify: false
    loginPublicBaseUrl: http://localhost:18080
  internalToken:
    secretName: ibkr-runtime-internal-token
    secretKey: AIP_INTERNAL_TOKEN
  kubernetesSpec:
    initContainer:
      image: ai-investment/ibkr-connector:dev

database:
  host: postgres
  port: 5432
  name: investment
  username: investment
  passwordSecretName: dev-postgres
  passwordSecretKey: POSTGRES_PASSWORD
  sslMode: disable

redis:
  host: redis
  port: 6379
  tlsEnabled: false

kafka:
  enabled: false
  bootstrapServers: kafka:9092
  securityProtocol: PLAINTEXT

keyVault:
  enabled: false

networkPolicy:
  enabled: false

featureFlags:
  mcpEnabled: true
  globalResearchAcquisitionEnabled: true

mcpGateway:
  enabled: true
  serviceIdentity: local-mcp-gateway
  authenticationType: LOCAL_SERVICE
  # Stable ID for the existing LOCAL dev-login user-a. Azure never uses this.
  localUserId: 653d39bb-f827-30c5-94cb-8296b3a56a56
  scopes:
    - mcp:read
    - watchlist:read
  externalProvidersEnabled: true
  yahooFinance:
    enabled: true
    transport: streamable-http
    endpoint: http://yahoo-finance-mcp/mcp
    authType: NONE
    authSecretName: ""
  service:
    type: ClusterIP
  ingress:
    enabled: false

yahooFinanceMcp:
  enabled: true
  image: ai-investment/yahoo-finance-mcp
  tag: dev
  transport: streamable-http
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  networkPolicy:
    enabled: false

marketData:
  demoMode: true
  quoteCacheMode: redis


# Stage 9: portfolio-service-only candidate image validation. Takes precedence over
# global.imageTag for this one workload only (see aip.imageExplicitTag in _helpers.tpl
# and the image line in templates/java-services.yaml); every other workload is governed
# by global.imageTag exactly as before. Candidate image already verified (HTTP/1.1 fix +
# Maven correctness gate); this entry does not itself deploy anything.
workloadOverrides:
  portfolio-service:
    imageTagOverride: dev-20261008-213512
  # Explicit DEV safety pin: research-engine uses a process-local lock
  # (research.distributedLock.backend: process), so it must never run more
  # than one replica or be autoscaled here, regardless of what
  # aiServiceDefaults/aiServices/aiServiceImageOverrides say. This is the
  # workload-level override templates/validate.yaml checks for at Helm-
  # template time (see the "process-local lock requires" guard) -- a lower
  # layer accidentally set to an unsafe value is still caught by that
  # guard everywhere this pin is NOT also present (e.g. in values.yaml,
  # which intentionally ships no such pin so non-DEV renders fail closed
  # instead of silently self-correcting).
  research-engine:
    replicaCount: 1
    autoscaling:
      enabled: false
