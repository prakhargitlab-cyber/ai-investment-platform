[project]
name = "ai-investment-mcp-gateway"
version = "0.2.0"
description = "Internal read-only MCP gateway for the AI Investment Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "httpx2>=2.12,<3",
  "mcp==2.2.0",
  "opentelemetry-api>=1.28,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
aip-mcp-gateway = "app.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
