mcpGateway:
  implemented: true
  enabled: false
  exposure: INTERNAL_ONLY
  image: ai-investment/mcp-gateway
  tag: latest
  port: 8000
  replicaCount: 1
  transport: streamable-http
  httpPath: /mcp
  maxRequestBodyBytes: 262144
  # Empty means the chart's centralized serviceEndpoints.researchEngine value.
  researchBaseUrl: ""
  serviceIdentity: local-mcp-gateway
  authenticationType: LOCAL_SERVICE
  localUserId: ""
  roles:
    - MCP_READER
  scopes:
    - mcp:read
  externalProvidersEnabled: false
  externalCallerIdentities:
    - research-engine
  yahooFinance:
    enabled: false
    transport: streamable-http
    endpoint: ""
    stdioCommand: ""
    stdioArgs: []
    authType: NONE
    authHeaderName: Authorization
    authSecretName: ""
    authSecretKey: yahoo-mcp-token
    stdioTokenEnvName: ""
    # A capability remains UNKNOWN (SHAREHOLDING defaults UNSUPPORTED) until
    # an approved server contract supplies an exact region/requirement/tool mapping.
    capabilities: []
    timeoutSeconds: 8
    maxRetries: 1
    retryBackoffSeconds: 0.2
    maxConcurrency: 4
  allowedHosts:
    - mcp-gateway
    - mcp-gateway:*
    - localhost
    - localhost:*
  allowedOrigins: []
  timeouts:
    invocationSeconds: 10
    connectSeconds: 3
    readSeconds: 8
  httpPool:
    maxConnections: 50
    maxKeepaliveConnections: 20
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  probes:
    startup:
      enabled: true
      path: /health
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    readiness:
      path: /health/ready
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false

yahooFinanceMcp:
  implemented: true
  enabled: false
  exposure: INTERNAL_ONLY
  image: ai-investment/yahoo-finance-mcp
  tag: latest
  port: 8002
  replicaCount: 1
  transport: streamable-http
  httpPath: /mcp
  maxRequestBodyBytes: 131072
  maxResponseItems: 1000
  upstreamTimeoutSeconds: 8
  maxConcurrency: 4
  userAgent: AIInvestmentResearchBot/0.1 contact=research-compliance@example.invalid
  # Executable first-party contracts. Tool success is still subject to strict
  # identity, freshness, and requirement-completeness validation at runtime.
  capabilities:
    - &yahoo_quote
      region: INDIA
      requirementId: LATEST_PRICE
      capability: LATEST_PRICE
      tool: get_quote
      state: SUPPORTED
      maxAgeSeconds: 900
    - &yahoo_history
      region: INDIA
      requirementId: HISTORICAL_PRICE_SERIES
      capability: MARKET_HISTORY
      tool: get_price_history
      state: SUPPORTED
      minimumItems: 2
      toolArguments: {lookbackDays: 400}
    - &yahoo_valuation
      region: INDIA
      requirementId: VALUATION_INPUTS
      capability: VALUATION_INPUTS
      tool: get_financials
      state: SUPPORTED
    - &yahoo_business
      region: INDIA
      requirementId: BUSINESS_QUALITY_FACTS
      capability: ANNUAL_FINANCIALS
      tool: get_financials
      state: SUPPORTED
    - &yahoo_growth
      region: INDIA
      requirementId: GROWTH_FACTS
      capability: GROWTH_INPUTS
      tool: get_financials
      state: SUPPORTED
    - &yahoo_balance
      region: INDIA
      requirementId: BALANCE_SHEET_FACTS
      capability: BALANCE_SHEET
      tool: get_financials
      state: SUPPORTED
    - &yahoo_quarterly
      region: INDIA
      requirementId: QUARTERLY_FINANCIALS
      capability: QUARTERLY_FINANCIALS
      tool: get_quarterly_financials
      state: SUPPORTED
    - &yahoo_news
      region: INDIA
      requirementId: CURRENT_NEWS
      capability: NEWS
      tool: get_news
      state: SUPPORTED
      toolArguments: {days: 30}
    - &yahoo_sector
      region: INDIA
      requirementId: SECTOR_MACRO
      capability: SECTOR_INDUSTRY
      tool: get_sector_industry
      state: SUPPORTED
    - &yahoo_profile
      region: INDIA
      requirementId: COMPANY_PROFILE
      capability: COMPANY_PROFILE
      tool: get_company_profile
      state: SUPPORTED
    - &yahoo_analyst
      region: INDIA
      requirementId: ANALYST_DATA
      capability: ANALYST_DATA
      tool: get_analyst_data
      state: SUPPORTED
    - &yahoo_shareholding
      region: INDIA
      requirementId: SHAREHOLDING
      capability: SHAREHOLDING
      state: UNSUPPORTED
    - {<<: *yahoo_quote, region: USA}
    - {<<: *yahoo_history, region: USA}
    - {<<: *yahoo_valuation, region: USA}
    - {<<: *yahoo_business, region: USA}
    - {<<: *yahoo_growth, region: USA}
    - {<<: *yahoo_balance, region: USA}
    - {<<: *yahoo_quarterly, region: USA}
    - {<<: *yahoo_news, region: USA}
    - {<<: *yahoo_sector, region: USA}
    - {<<: *yahoo_profile, region: USA}
    - {<<: *yahoo_analyst, region: USA}
    - {<<: *yahoo_shareholding, region: USA}
    - {<<: *yahoo_quote, region: EUROPE}
    - {<<: *yahoo_history, region: EUROPE}
    - {<<: *yahoo_valuation, region: EUROPE}
    - {<<: *yahoo_business, region: EUROPE}
    - {<<: *yahoo_growth, region: EUROPE}
    - {<<: *yahoo_balance, region: EUROPE}
    - {<<: *yahoo_quarterly, region: EUROPE}
    - {<<: *yahoo_news, region: EUROPE}
    - {<<: *yahoo_sector, region: EUROPE}
    - {<<: *yahoo_profile, region: EUROPE}
    - {<<: *yahoo_analyst, region: EUROPE}
    - {<<: *yahoo_shareholding, region: EUROPE}
  allowedHosts:
    - yahoo-finance-mcp
    - yahoo-finance-mcp:*
