spring:
  application:
    name: broker-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:investment}
    username: ${DB_USER:investment}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
broker:
  ibkr:
    enabled: ${IBKR_ENABLED:false}
    base-url: ${IBKR_BASE_URL:}
    client-id: ${IBKR_CLIENT_ID:}
    callback-url: ${IBKR_CALLBACK_URL:}
    auth-method: ${IBKR_AUTH_METHOD:}
    official-documentation-verified: ${IBKR_OFFICIAL_DOCUMENTATION_VERIFIED:false}
  icici-direct:
    enabled: ${ICICI_DIRECT_ENABLED:false}
    base-url: ${ICICI_DIRECT_BASE_URL:}
    client-id: ${ICICI_DIRECT_CLIENT_ID:}
    callback-url: ${ICICI_DIRECT_CALLBACK_URL:}
    auth-method: ${ICICI_DIRECT_AUTH_METHOD:}
    official-documentation-verified: ${ICICI_DIRECT_OFFICIAL_DOCUMENTATION_VERIFIED:false}
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
