{{- if .Values.global.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aip.serviceAccountName" . }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "platform") | nindent 4 }}
  {{- with .Values.global.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
---
{{- end }}
{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ required "keyVault.secretProviderClassName is required when Key Vault is enabled" .Values.keyVault.secretProviderClassName }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "key-vault") | nindent 4 }}
spec:
  provider: azure
  {{- with .Values.keyVault.secretObjects }}
  secretObjects:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "keyVault.clientId is required when Key Vault is enabled" .Values.keyVault.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required when Key Vault is enabled" .Values.keyVault.name | quote }}
    {{- if .Values.keyVault.cloudName }}
    cloudName: {{ .Values.keyVault.cloudName | quote }}
    {{- end }}
    tenantId: {{ required "keyVault.tenantId is required when Key Vault is enabled" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range .Values.keyVault.objects }}
        - |
          objectName: {{ required "Every Key Vault object requires objectName" .objectName }}
          objectType: {{ default "secret" .objectType }}
          {{- with .objectVersion }}
          objectVersion: {{ . | quote }}
          {{- end }}
          {{- with .objectAlias }}
          objectAlias: {{ . }}
          {{- end }}
      {{- end }}
{{- end }}
