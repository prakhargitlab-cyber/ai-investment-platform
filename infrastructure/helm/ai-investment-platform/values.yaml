  privateKeyReference: ""
  sessionReference: ""

iciciDirect:
  enabled: false
  officialDocumentationVerified: false
  baseUrl: https://api.icicidirect.com/breezeapi/api/v1/
  loginUrl: https://api.icicidirect.com/apiuser/login
  redirectUrl: ""
  authMethod: breeze-interactive-session
  credentialSecretName: ""
  appKeySecretKey: app-key
  secretKeySecretKey: secret-key
  secretKeyEnvironmentVariable: ICICI_DIRECT_SECRET_KEY

ibkrConnector:
  enabled: false
  image: ai-investment/ibkr-connector
  tag: latest
  port: 8080
  replicaCount: 1
  runtimeMode: LOCAL_AGENT
  productionApproved: false
  gatewayPackagePath: ""
  gatewayBaseUrl: ""
  gatewayTlsVerify: true
  loginPublicBaseUrl: ""
  internalToken: ""
  internalTokenSecretName: ""
  internalTokenSecretKey: AIP_INTERNAL_TOKEN
  packageVolumeClaim: ""
  service:
    type: ClusterIP
    port: 80
  probes:
    startup:
      enabled: true
      path: /health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 30
    readiness:
      path: /health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# The Client Portal Gateway package PVC is DEV_ONLY. It is not an AKS package
# distribution design and remains disabled in the Azure overlay.
ibkrRuntime:
  mode: STATIC
  namespace: ""
  image:
    repository: ai-investment/ibkr-connector
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ibkr-runtime-orchestrator
    annotations: {}
  startupTimeoutSeconds: 120
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}
  serviceAnnotations: {}
  serviceLabels: {}
  azure:
    workloadIdentity:
      enabled: false
      clientId: ""
  gatewayPackage:
    classification: DEV_ONLY
    claimName: ""
    mountPath: /opt/ibkr/clientportal.gw-source
    readOnly: true
  workspace:
    classification: EPHEMERAL
    mountPath: /opt/ibkr/runtime
    medium: ""
    sizeLimit: ""
  internalToken:
    secretName: ""
    secretKey: ""
  gateway:
    baseUrl: https://127.0.0.1:5000/v1/api
    tlsVerify: true
    loginPublicBaseUrl: ""
  kubernetesSpec:
    initContainer:
      name: copy-gateway-package
      image: ""
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args: ["cp -a /opt/ibkr/clientportal.gw-source/. /opt/ibkr/runtime/ && chown -R 1000:1000 /opt/ibkr/runtime && chmod u+x /opt/ibkr/runtime/bin/run.sh"]
    startupProbe: { path: /actuator/health/readiness, initialDelaySeconds: 0, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 30, successThreshold: 1 }
    readinessProbe: { path: /actuator/health/readiness, initialDelaySeconds: 0, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3, successThreshold: 1 }
    livenessProbe: { path: /actuator/health/liveness, initialDelaySeconds: 0, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3, successThreshold: 1 }
    ports: { containerPort: 8080, servicePort: 80, serviceTargetPort: 8080, gatewayPort: 5000 }
    security: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, dropCapabilities: ["ALL"] }

