  oauth2BaseUrl: ""
  gatewayBaseUrl: ""
  clientId: ""
  clientKeyId: ""
  callbackUrl: ""
  authMethod: client-portal-gateway
  officialDocumentationVerified: false
  marketDataEnabled: false
  insecureTls: false
  connectorBaseUrl: ""
  connectorRuntimeMode: LOCAL_AGENT
  connectorLoginUrl: ""
  connectorInternalToken: ""
  connectorInternalTokenSecretName: ""
  connectorInternalTokenSecretKey: AIP_INTERNAL_TOKEN
